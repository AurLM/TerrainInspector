# Builds "Terrain Inspector.exe" on GitHub's Windows machines.
# Needs, at the root of the repository: terrain-inspector.html, and the app/ folder.
# The result is under Actions > the latest run > Artifacts > Terrain-Inspector-windows (a zip of the folder to upload to Nexus).
name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build the program
        run: dotnet publish app/TerrainInspector.csproj -c Release -o out

      - name: Put the tool page (and read-me, if any) next to the program
        shell: bash
        run: |
          test -f terrain-inspector.html || { echo "terrain-inspector.html is missing at the root of the repository"; exit 1; }
          cp terrain-inspector.html out/
          if [ -f README.txt ]; then cp README.txt out/; fi
          rm -f out/*.pdb out/*.xml
          ls -la out

      - name: Check that every file the program needs is there
        shell: bash
        run: |
          for f in "Terrain Inspector.exe" WebView2Loader.dll Microsoft.Web.WebView2.Core.dll Microsoft.Web.WebView2.WinForms.dll terrain-inspector.html; do
            test -f "out/$f" || { echo "missing: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: Terrain-Inspector-windows
          path: out
